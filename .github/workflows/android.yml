name: Android CI 自動發佈

on:
  push:
    branches: [ "main" ] # 若主分支為 master 請自行更換
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4

      - name: ☕ 設定 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 賦予 gradlew 執行權限
        run: chmod +x gradlew

      - name: 🔨 編譯 Debug APK 並注入動態版本號
        run: |
          ./gradlew assembleDebug \
            -Pandroid.injected.version.code=${{ github.run_number }} \
            -Pandroid.injected.version.name="1.0.${{ github.run_number }}"

      - name: 🏷️ 自動重命名 APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk UECapUpdater-v1.0.${{ github.run_number }}.apk

      - name: 🚀 自動發佈到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: UECapUpdater v1.0.${{ github.run_number }}
          body: |
            ## 🚀 Automated Release / 自動編譯版本發佈
            
            * **Version / 內部版本**: `v1.0.${{ github.run_number }}` (Build Code: `${{ github.run_number }}`)
            
            ---
            
            ### 📝 Update Log / 更新內容
            ```text
            ${{ github.event.head_commit.message }}
            ```
          files: UECapUpdater-v1.0.${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}