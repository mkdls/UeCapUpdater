name: Android CI (自動打包 APK)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 複製儲存庫原始碼
      uses: actions/checkout@v4

    - name: ☕ 設定 Java 環境 (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: 🔑 賦予 Gradle 執行權限
      run: chmod +x ./gradlew

    - name: 🏗️ 開始自動編譯 Debug APK
      run: ./gradlew assembleDebug

    # 🛠️ 新增這步：使用 Android SDK 內建的測試金鑰對 APK 進行 V2/V3 簽名
    - name: ✍️ 自動為 APK 進行數位簽名
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/debug
        signingKeyBase64: ${{ secrets.SIGNING_KEY }} # 如果是公開專案可自訂，若私有專案可直接使用內建 debug 簽名
      continue-on-error: true # 防止因金鑰未設定而中斷

    - name: 📤 上傳生成的 APK 到 GitHub 雲端
      uses: actions/upload-artifact@v4
      with:
        name: UECapUpdater-Debug-APK # 可以順便把雲端下載的壓縮檔名稱也改掉
        path: app/build/outputs/apk/debug/*.apk # 使用通配符 *.apk 確保萬無一失