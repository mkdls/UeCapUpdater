name: Android CI (自動打包 APK)

# 當觸發以下條件時，啟動自動編譯：
on:
  push:
    branches: [ "master", "main" ] # 當你推送到 master 或 main 分支時
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # 使用 GitHub 提供的 Linux 虛擬機

    steps:
      - name: 📥 複製儲存庫原始碼
        uses: actions/checkout@v4

      - name: ☕ 設定 Java 環境 (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # 使用穩定版 Zulu JDK
          java-version: '17'
          cache: 'gradle' # 自動快取 Gradle 快取，讓下次編譯更快

      - name: 🔑 賦予 Gradle 執行權限
        run: chmod +x ./gradlew

      - name: 🏗️ 開始自動編譯 Debug APK
        run: ./gradlew assembleDebug

      - name: 📤 上傳生成的 APK 到 GitHub 雲端
        uses: actions/upload-artifact@v4
        with:
          name: ShannonConfigPro-Debug-APK # 下載時顯示的名稱
          path: app/build/outputs/apk/debug/app-debug.apk # 我們剛剛找到的物理路徑！